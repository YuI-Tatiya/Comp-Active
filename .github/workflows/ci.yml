name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # prisma generate only needs a syntactically valid URL, not a live DB —
      # nothing in this job connects to Postgres.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      # ต้องยาว >= 32 ตัวอักษรและไม่ใช่ค่าตัวอย่าง ไม่งั้น jwt.config.ts จะไม่ยอมบูต
      # (ค่านี้ใช้เฉพาะใน CI ไม่ใช่ค่าที่ใช้จริงที่ไหน)
      JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      JWT_EXPIRES_IN: 7d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build (prisma generate + nest build)
        run: npm run build

      - name: Unit tests
        run: npx jest --passWithNoTests

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

