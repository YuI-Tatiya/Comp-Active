services:
  postgres:
    image: postgres:16-alpine
    container_name: compactive_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compactive_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ผูกกับ loopback เท่านั้น — เดิมเป็น "5433:5432" ซึ่ง Docker เปิดที่ 0.0.0.0
      # ทำให้ทุกคนใน Wi-Fi เดียวกัน (มหาลัย/หอ/ร้านกาแฟ) ต่อฐานข้อมูลได้โดยตรง
      # ด้วยรหัส postgres/postgres ที่ตั้งไว้ด้านบน — เครื่องมือ DB ในเครื่องยังใช้ได้ปกติ
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10 

  # ปรับ schema ฐานข้อมูลแล้วจบการทำงาน — ไม่ใช่ service ที่รันค้าง
  # แยกออกจาก backend เพราะขั้นนี้ต้องใช้ prisma CLI ซึ่งลาก driver ของทุกฐานข้อมูล
  # (mysql2, postgres, better-sqlite3) มาด้วย ทั้งที่โปรเจกต์ใช้แค่ PostgreSQL
  # อิมเมจ production จึงไม่ต้องแบกไฟล์พวกนั้นไว้
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    container_name: compactive_migrate
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/compactive_db
      # ตั้งเป็น true ชั่วคราวเมื่อจงใจเปลี่ยน schema แบบที่ข้อมูลเดิมจะหาย
      PRISMA_ACCEPT_DATA_LOSS: "false"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: compactive_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/compactive_db
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://app.localhost
      ADMIN_FRONTEND_URL: http://admin.localhost
    volumes:
      - backend_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      # ต้องรอให้ schema ตรงกับโค้ดก่อน ไม่งั้น query แรกจะพังเพราะคอลัมน์ยังไม่มี
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # เรียก API ผ่านโดเมนของหน้าเว็บเอง (app.localhost/api → nginx → backend)
        # ให้ cookie ของ session เป็น first-party — ดู frontend/lib/api-base.ts
        NEXT_PUBLIC_API_URL: same-origin
        # มิเรอร์ของ ADMIN_HOSTS ด้านล่าง สำหรับ MascotWidget ฝั่ง client (ดู lib/admin-host.ts) —
        # ต้องตั้งให้ตรงกับ ADMIN_HOSTS เสมอถ้าจะเปลี่ยนโดเมนแอดมิน
        NEXT_PUBLIC_ADMIN_HOSTS: admin.localhost
    container_name: compactive_frontend
    environment:
      # โฮสต์ที่ proxy.ts ยอมให้เข้าโซนแอดมิน (allowlist เทียบตรงตัว)
      ADMIN_HOSTS: admin.localhost
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: compactive_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_uploads:
