services:
  postgres:
    image: postgres:16-alpine
    container_name: compactive_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compactive_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10 

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compactive_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/compactive_db
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://app.localhost
      ADMIN_FRONTEND_URL: http://admin.localhost
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api.localhost
    container_name: compactive_frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: compactive_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
