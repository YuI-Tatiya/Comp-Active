# ============================================================================
#  Comp Active — Nginx API Gateway
#  ปรับตาม OWASP A02 (Security Misconfiguration) + A10 (Exceptional Conditions)
# ============================================================================

# ไม่ประกาศเวอร์ชัน nginx ใน response header และหน้า error
server_tokens off;

# ── ถังนับ rate limit (A10: กัน DoS / brute force ตั้งแต่ขอบ) ────────────────
# แยกถังตามความอ่อนไหวของ endpoint แทนที่จะใช้ค่าเดียวทั้งระบบ
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;   # ทราฟฟิกหน้าเว็บทั่วไป
limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;    # login / register / OTP
limit_req_zone $binary_remote_addr zone=devapi:10m  rate=10r/s;   # Developer API สาธารณะ
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ตอบ 429 (ไม่ใช่ 503) เมื่อชนลิมิต เพื่อให้ client รู้ว่าเป็นเรื่อง rate limit
limit_req_status 429;
limit_conn_status 429;

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:3001;
}

# ── ค่ากลางของการ proxy — ใช้ซ้ำทุก server block ────────────────────────────
# สำคัญ: ตั้ง X-Forwarded-Host เองเสมอ เพื่อ "ทับ" ค่าที่ client ปลอมส่งมา
# ถ้าไม่ทับ ค่าที่ผู้ใช้แนบมาเองจะทะลุถึง Next.js proxy.ts และหลอกให้ระบบ
# คิดว่าคำขอมาจากโดเมนแอดมินได้ (ทดสอบยืนยันแล้วว่า Next ไม่ล้างค่านี้ให้)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name admin.localhost;

    client_max_body_size 2m;
    limit_conn conn_per_ip 50;

    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ล้าง header ที่ client ใช้หลอก routing/authorization ของ framework ได้
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}

server {
    listen 80;
    server_name app.localhost;

    client_max_body_size 2m;
    limit_conn conn_per_ip 50;

    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}

server {
    listen 80;
    server_name api.localhost;

    # อัปโหลดไฟล์แนบสูงสุด 10MB ที่ฝั่ง backend — เผื่อ overhead ของ multipart
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn conn_per_ip 30;

    # ── endpoint กลุ่ม auth: เข้มที่สุด (A07) ──────────────────────────────
    # ด่านหยาบระดับ IP กัน Burp Intruder / Hydra ที่ยิงเป็นร้อยครั้งต่อวินาที
    # ส่วนการนับรายบัญชีอยู่ที่ AuthThrottlerGuard ฝั่ง NestJS ซึ่งกัน
    # password spraying ที่กระจาย IP ได้ด้วย
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # ── Developer API สาธารณะ: throttle ตาม CLAUDE.md ─────────────────────
    location /api/v1/ {
        limit_req zone=devapi burst=30 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # ── Swagger: ปิดจากภายนอกเสมอ ─────────────────────────────────────────
    # ฝั่ง NestJS ปิดให้แล้วเมื่อ NODE_ENV=production แต่กันไว้อีกชั้นที่ขอบ
    # เผื่อ container ถูกรันด้วย NODE_ENV ที่ตั้งพลาด
    location = /api      { return 404; }
    location = /api-json { return 404; }
    location = /api-yaml { return 404; }

    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}

# ── ยังไม่มี TLS ──────────────────────────────────────────────────────────
# ตอนนี้ระบบวิ่งบน http://*.localhost ซึ่งใช้ได้เฉพาะตอน dev/demo
# ก่อนขึ้นโดเมนจริง ให้ทำสามอย่างนี้:
#   1) ออกใบรับรอง (Let's Encrypt / certbot หรือใบรับรองของมหาลัย)
#   2) เปิด server block 443 ด้านล่าง แล้วเปลี่ยน server_name เป็นโดเมนจริง
#   3) ตั้ง ENABLE_HTTPS=true ตอน build frontend เพื่อเปิด HSTS +
#      upgrade-insecure-requests (ดู frontend/next.config.ts)
#
# server {
#     listen 443 ssl http2;
#     server_name app.compactive.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#     # ...location block เหมือนด้านบน...
# }
#
# server {
#     listen 80;
#     server_name app.compactive.com admin.compactive.com api.compactive.com;
#     return 301 https://$host$request_uri;
# }

# โฮสต์ที่ไม่รู้จักต้องไม่ถูกส่งต่อไปที่ใด — ปิดช่อง Host header attack
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
