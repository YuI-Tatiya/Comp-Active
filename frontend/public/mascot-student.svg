  <path d="M182 192 Q200 216 218 192 Q200 200 182 192 Z" fill="#8b1d2c" stroke="#8b1d2c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M190 202 Q200 210 210 202 Q200 198 190 202 Z" fill="#ff8aa0"/>

  <!-- ประกายน่ารักข้างมือที่โบก -->
