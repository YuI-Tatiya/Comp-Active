      <stop offset="0" stop-color="#2d4a8a"/>
      <stop offset="1" stop-color="#22397a"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffe3c8"/>
      <stop offset="1" stop-color="#ffd0a8"/>
